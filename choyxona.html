<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Choyxona | Sultan Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://i.postimg.cc/XqhdfVWD/abstract-uv-ultraviolet-light-composition-23-2149243965.avif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Jost', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные светящиеся элементы */
        .glow-spot {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 100, 200, 0.3) 0%, rgba(100, 50, 255, 0) 80%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
        .spot-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .spot-2 { width: 500px; height: 500px; bottom: -150px; right: -150px; animation-duration: 5s; }
        .spot-3 { width: 300px; height: 300px; top: 40%; right: 5%; animation-duration: 3.5s; background: radial-gradient(circle, rgba(0, 200, 255, 0.25) 0%, rgba(0,0,0,0) 80%); }

        /* Кнопка НАЗАД */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 18px;
            color: #FFD9A5;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s ease;
            border: 0.5px solid rgba(255,215,0,0.4);
            z-index: 20;
        }
        .back-button:hover {
            background: rgba(255, 215, 0, 0.25);
            transform: translateX(-3px);
        }

        /* Стеклянная карточка */
        .container {
            position: relative;
            z-index: 10;
            max-width: 520px;
            width: 100%;
            background: rgba(15, 15, 25, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 60px;
            padding: 2.2rem 1.5rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Фото места */
        .place-photo {
            width: 100%;
            border-radius: 40px;
            margin-bottom: 1.2rem;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 150, 0.4);
        }
        .place-photo img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }
        .place-photo img:hover {
            transform: scale(1.02);
        }

        .initials {
            font-family: 'Allura', 'Great Vibes', cursive;
            font-size: 3.8rem;
            background: linear-gradient(135deg, #fdff6f, #ffba6a, #f7e755);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
            letter-spacing: 0.02em;
            text-shadow: 0 0 15px rgba(255,100,200,0.5);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff0e0;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #FFE5B4, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Карточка с описанием */
        .message-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 1.2rem 0.8rem;
            margin: 1rem 0 1.2rem;
            border: 1px solid rgba(255,255,200,0.2);
        }

        .main-message {
            font-size: 1.2rem;
            font-weight: 500;
            color: #FFE5B4;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        /* БЛОК С КНОПКАМИ КАРТ */
        .map-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 0.8rem 0 1rem;
        }
        .map-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(20, 20, 35, 0.8);
            backdrop-filter: blur(8px);
            padding: 14px 16px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
        }
        .map-btn.yandex {
            background: linear-gradient(105deg, #cc0000, #990000);
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .map-btn.google {
            background: linear-gradient(105deg, #1a73e8, #0d47a1);
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .map-btn span {
            font-size: 1.4rem;
        }
        .map-btn:active {
            transform: scale(0.97);
        }
        .map-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        /* Телефонная кнопка */
        .call-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: linear-gradient(105deg, #00c6a7, #008b74);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0.9rem 1.5rem;
            border-radius: 80px;
            margin: 0.5rem 0 0.2rem;
            transition: 0.25s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 100%;
            border: none;
            cursor: pointer;
        }
        .call-button:active {
            transform: scale(0.96);
        }
        .footer-note {
            font-size: 0.7rem;
            color: #ccb9a6;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255,240,210,0.2);
            padding-top: 1rem;
        }

        @media (max-width: 560px) {
            .container { padding: 1.5rem 1rem; margin: 0 12px; }
            .initials { font-size: 3rem; }
            .title { font-size: 1.5rem; }
            .main-message { font-size: 1rem; }
            .map-btn { font-size: 1rem; padding: 10px 12px; }
            .map-btn span { font-size: 1.2rem; }
            .call-button { font-size: 1.1rem; padding: 0.7rem 1rem; }
            .back-button { top: 12px; left: 12px; padding: 5px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="glow-spot spot-1"></div>
    <div class="glow-spot spot-2"></div>
    <div class="glow-spot spot-3"></div>

    <div class="container">
        <!-- Кнопка НАЗАД -->
        <a href="index.html" class="back-button">← Назад</a>

        <!-- Фото места сверху (новое) -->
        <div class="place-photo">
            <img src="https://i.postimg.cc/brQN2S5x/2u1u.jpg" alt="Choyxona manzili">
        </div>

        <div class="initials">Sultan Garden</div>
        <div class="title">CHOYXONA</div>

        <div class="message-card">
            <div class="main-message">
                 Соат 18:00да <br>
                 Кутиб қоламиз!
            </div>
        </div>

        <!-- ДВЕ КНОПКИ КАРТ (Яндекс и Google) -->
        <div class="map-buttons">
            <a href="https://yandex.uz/maps/-/CPcceKZn" class="map-btn yandex" target="_blank" rel="noopener noreferrer">
                <span>🗺️</span> Яндекс Карта
            </a>
            <a href="https://maps.app.goo.gl/eftuwCDj3P6rZSPf8" class="map-btn google" target="_blank" rel="noopener noreferrer">
                <span>📍</span> Google Карта
            </a>
        </div>
        <div class="footer-note">
            ❗️ Хамма келиши шарт ❗️
        </div>
    </div>

</body>
</html>
